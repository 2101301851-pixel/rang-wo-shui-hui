<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>让我睡会 · 半梦半醒上班路</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#14101f; }
  body { display:flex; align-items:center; justify-content:center;
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9;
    background:#14101f; overflow:hidden; }
  #game { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

  /* ---------- HUD ---------- */
  .hud { position:absolute; inset:0; pointer-events:none; color:#f5eeda; }
  .panel { background:rgba(38,30,58,.78); border:.16em solid #f5eeda22; border-radius:.35em;
    box-shadow:0 .18em 0 rgba(0,0,0,.25); backdrop-filter:blur(2px); }
  #panelWake { position:absolute; left:1em; top:1em; padding:.5em .7em .6em; width:16em; }
  /* 第二章：挪到右侧摸鱼值面板下方，避免挡住主角 */
  #panelWake.posL2 { left:auto; right:1em; top:6.6em; width:13em; }
  #panelWake .row1 { display:flex; justify-content:space-between; align-items:baseline;
    font-size:.78em; letter-spacing:.12em; color:#cfc4e8; }
  #wakeState { font-weight:bold; letter-spacing:.08em; }
  #meter { position:relative; margin-top:.35em; height:1em; background:#221b36;
    border-radius:.5em; overflow:hidden; box-shadow:inset 0 2px 3px rgba(0,0,0,.5); }
  #wakeFill { position:absolute; left:0; top:0; bottom:0; width:52%;
    background:linear-gradient(90deg,#6f86c8aa,#b48ad4aa); }
  #band { position:absolute; left:40%; width:22%; top:0; bottom:0;
    background:#f2a7c3; opacity:.75; box-shadow:0 0 .6em #f2a7c3; }
  #zoneLow, #zoneHigh { position:absolute; top:0; bottom:0; width:18%; display:none; }
  #zoneLow { left:0; background:linear-gradient(90deg, rgba(232,93,93,.5), rgba(232,93,93,0)); }
  #zoneHigh { right:0; background:linear-gradient(270deg, rgba(240,144,74,.5), rgba(240,144,74,0)); }
  #pointer { position:absolute; top:50%; width:.72em; height:.72em; background:#ffe9b0;
    border:.09em solid #4a3a5c; transform:translate(-50%,-50%) rotate(45deg);
    box-shadow:0 0 .4em #ffe9b0aa; }
  #meterEdgeL,#meterEdgeR { position:absolute; top:50%; transform:translateY(-50%);
    font-size:.65em; color:#fffdf5cc; z-index:2; text-shadow:0 1px 0 #0008; }
  #meterEdgeL{ left:.3em; } #meterEdgeR{ right:.3em; }
  #panelWake.warn { border-color:#e85d5d; animation:warnPulse .8s infinite; }
  @keyframes warnPulse { 0%,100%{ box-shadow:0 0 0 rgba(232,93,93,0);} 50%{ box-shadow:0 0 .8em #e85d5d99; border-color:#ff8d8d; } }

  #panelScore { position:absolute; right:1em; top:1em; padding:.45em .7em .55em; text-align:right; min-width:11em; }
  .lvBtns { margin-top:1.4em; display:flex; gap:1em; justify-content:center; }
  .lvBtns .btn { margin-top:0; }
  .btn.locked { opacity:.5; pointer-events:none; filter:saturate(.3); cursor:default; }
  .btn.locked:hover { transform:none; box-shadow:0 .28em 0 #322a4a; }
  #panelSlack { position:absolute; right:1em; top:1em; padding:.45em .7em .55em; text-align:right; min-width:13em; }
  #slackBar { margin-top:.35em; height:.7em; width:12em; background:#221b36; border-radius:.35em;
    overflow:hidden; margin-left:auto; box-shadow:inset 0 1px 2px rgba(0,0,0,.5); }
  #slackFill { height:100%; width:0%; background:linear-gradient(90deg,#8ad4b0,#f2cf8a); border-radius:.35em; }
  #leaderTxt { font-weight:bold; }
  #panelScore .sc { font-size:1.05em; font-weight:bold; letter-spacing:.06em; color:#ffe9b0; text-shadow:0 2px 0 #00000055; }
  #panelScore .sc .lab { font-size:.7em; color:#cfc4e8; font-weight:normal; letter-spacing:.15em; margin-right:.3em; }
  #route { margin-top:.4em; height:.5em; width:10em; background:#221b36; border-radius:.3em;
    overflow:hidden; margin-left:auto; box-shadow:inset 0 1px 2px rgba(0,0,0,.5); }
  #routeFill { height:100%; width:0%; background:linear-gradient(90deg,#8ad4b0,#f2cf8a); border-radius:.3em; }
  #routeLab { font-size:.6em; color:#bdb2d8; letter-spacing:.1em; margin-top:.25em; display:flex; justify-content:space-between; }

  #hint { position:absolute; left:50%; bottom:1.2em; transform:translateX(-50%);
    padding:.45em 1.1em; font-size:.82em; letter-spacing:.08em; color:#fdf6e3;
    background:rgba(30,24,48,.72); border-radius:1em; white-space:nowrap;
    opacity:0; transition:opacity .35s; max-width:90%; }
  #hint.show { opacity:1; }
  #hint b { color:#f2cf8a; }

  #muteBtn { position:absolute; right:1em; bottom:1em; pointer-events:auto; cursor:pointer;
    padding:.3em .6em; font-size:.9em; color:#cfc4e8; user-select:none; }
  #muteBtn:hover { color:#ffe9b0; }

  /* ---------- Overlays ---------- */
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; pointer-events:auto; }
  .hidden { display:none !important; }
  #overlayTitle { background:linear-gradient(180deg, rgba(20,14,38,.10), rgba(20,14,38,.42)); }
  .titleCard { text-align:center; color:#fdf6e3; }
  #gameTitle { font-size:3.4em; font-weight:bold; letter-spacing:.18em; color:#fdf6e3;
    text-shadow:0 .09em 0 #4a3a6c, 0 .14em 0 #241d3a, 0 .2em .5em rgba(0,0,0,.5);
    animation:titleBob 3.2s ease-in-out infinite; }
  @keyframes titleBob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-.12em);} }
  #gameTitle .moon { display:inline-block; color:#f2cf8a; margin-right:.18em; }
  .subtitle { margin-top:.7em; font-size:.95em; letter-spacing:.42em; color:#cfc4e8; text-indent:.42em; }
  .story { margin-top:1.4em; font-size:.8em; line-height:1.95; color:#e8dfc8; letter-spacing:.1em;
    background:rgba(30,24,48,.6); padding:1em 1.8em; border-radius:.5em;
    border:.14em solid #f5eeda22; }
  .story b { color:#f2cf8a; }
  .controls { margin-top:1.1em; font-size:.68em; color:#bdb2d8; letter-spacing:.12em; }
  #loadLine { margin-top:.9em; font-size:.66em; color:#f2cf8a; letter-spacing:.18em; min-height:1em; }
  kbd { background:#3a3054; border:1px solid #5c4f80; border-bottom-width:3px; border-radius:.3em;
    padding:.1em .5em; font-family:inherit; color:#fdf6e3; margin:0 .15em; }
  .btn { margin-top:1.4em; pointer-events:auto; cursor:pointer; border:none;
    font-family:inherit; font-size:1.05em; font-weight:bold; letter-spacing:.28em; text-indent:.28em;
    color:#3a2c4e; background:#ffe9b0; padding:.65em 2.2em; border-radius:.5em;
    box-shadow:0 .28em 0 #c9a06a, 0 .45em .8em rgba(0,0,0,.35);
    transition:transform .08s, box-shadow .08s; }
  .btn:hover { transform:translateY(-.1em); box-shadow:0 .38em 0 #c9a06a, 0 .6em 1em rgba(0,0,0,.4); }
  .btn:active { transform:translateY(.18em); box-shadow:0 .1em 0 #c9a06a; }
  #bestLine { margin-top:1em; font-size:.7em; color:#a99cc8; letter-spacing:.15em; }

  #overlayEnd, #overlayPause { background:rgba(16,12,32,.66); }
  .endCard { text-align:center; color:#fdf6e3; background:rgba(34,27,54,.92);
    border:.16em solid #f5eeda33; border-radius:.8em; padding:2em 3em;
    box-shadow:0 1em 2.5em rgba(0,0,0,.5); position:relative; min-width:20em; }
  #endTitle { font-size:1.9em; font-weight:bold; letter-spacing:.15em; }
  #endDesc { margin-top:.8em; font-size:.78em; line-height:1.9; color:#d8cfe8; letter-spacing:.08em; }
  #endStats { margin-top:1.1em; font-size:.8em; line-height:2; color:#e8dfc8; letter-spacing:.1em; text-align:left;
    display:inline-block; }
  #endStats b { color:#f2cf8a; }
  #endRank { position:absolute; right:-1em; top:-1em; width:2.6em; height:2.6em; line-height:2.6em;
    border-radius:50%; font-size:1.5em; font-weight:bold; transform:rotate(12deg);
    border:.14em solid currentColor; background:rgba(20,16,38,.9); }
  .endBtns { margin-top:1.3em; display:flex; gap:1em; justify-content:center; }
  .btn.small { font-size:.85em; padding:.55em 1.6em; }
  .btn.ghost { background:#4a3f68; color:#e8dfc8; box-shadow:0 .28em 0 #322a4a; }
  #btnBonus { background:#f2a7c3; color:#5c2438; box-shadow:0 .28em 0 #c96a8c, 0 .45em .8em rgba(0,0,0,.35); }
  #btnBonus:hover { box-shadow:0 .38em 0 #c96a8c, 0 .6em 1em rgba(0,0,0,.4); }

  #err { position:absolute; left:0; right:0; top:0; background:#5c1f2e; color:#ffd9d9;
    font-size:12px; padding:6px 10px; display:none; z-index:99; white-space:pre-wrap; }

  /* ---------- 角色选择 ---------- */
  #overlaySelect { background:rgba(16,12,32,.72); }
  .selCard { background:rgba(34,27,54,.94); border:.16em solid #f5eeda33; border-radius:.8em;
    padding:1.4em 2em; text-align:center; color:#fdf6e3; box-shadow:0 1em 2.5em rgba(0,0,0,.5); }
  #selHead { font-size:1.3em; font-weight:bold; letter-spacing:.15em; margin-bottom:1em; }
  #selHead span { font-size:.6em; color:#f2cf8a; }
  #selChars { display:flex; gap:1.4em; justify-content:center; }
  .selCharOpt { cursor:pointer; border:.18em solid #5c4f80; border-radius:.5em; padding:.5em .6em .3em;
    background:#2a2142; transition:border-color .1s, transform .1s; }
  .selCharOpt:hover { transform:translateY(-.15em); }
  .selCharOpt.on { border-color:#ffe9b0; box-shadow:0 0 .8em #ffe9b066; }
  .selCharOpt canvas { image-rendering:pixelated; display:block; margin:0 auto; }
  .selName { font-size:.7em; color:#cfc4e8; margin-top:.3em; letter-spacing:.1em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="270"></canvas>

  <div class="hud">
    <div id="panelWake" class="panel hudPlay">
      <div class="row1"><span>清醒度</span><span id="wakeState">半梦半醒</span></div>
      <div id="meter">
        <div id="wakeFill"></div>
        <div id="band"></div>
        <div id="zoneLow"></div>
        <div id="zoneHigh"></div>
        <span id="meterEdgeL">☾</span><span id="meterEdgeR">☀</span>
        <div id="pointer"></div>
      </div>
    </div>
    <div id="panelScore" class="panel hudPlay">
      <div class="sc"><span class="lab">朦胧值</span><span id="scoreVal">0</span></div>
      <div id="route"><div id="routeFill"></div></div>
      <div id="routeLab"><span>家</span><span>公司</span></div>
    </div>
    <div id="panelSlack" class="panel hudPlay">
      <div class="row1"><span>摸鱼值</span><span id="slackVal" style="color:#8ad4b0;font-weight:bold;">0</span></div>
      <div id="slackBar"><div id="slackFill"></div></div>
      <div class="row1" style="margin-top:.3em;">
        <span id="clockTxt">09:00</span>
        <span id="leaderTxt">领导巡视中…</span>
      </div>
    </div>
    <div id="hint"></div>
    <div id="muteBtn" class="panel hudPlay">♪ 开</div>
  </div>

  <div id="overlayTitle" class="overlay">
    <div class="titleCard">
      <div id="gameTitle"><span class="moon">☾</span>让我睡会</div>
      <div class="subtitle">—— 半 梦 半 醒 上 班 路 ——</div>
      <div class="story">
        清晨七点，闹钟响过第三遍。<br>
        一路上，<b>咖啡</b>让你清醒，<b>早餐</b>让你犯困。<br>
        困了可以坐<b>长椅</b>打个盹儿——坐过头可就睡过去了；<br>
        <b>红灯</b>前站着等会更困，闯红灯被交警逮住，会罚得你瞬间清醒。<br>
        别彻底醒来，也别睡过去——把这份<b>朦胧</b>，平安带到公司吧。
      </div>
      <div class="controls">
        <kbd>↑</kbd><kbd>↓</kbd> 或 <kbd>W</kbd><kbd>S</kbd> 切换车道 &nbsp;·&nbsp;
        <kbd>空格</kbd> 互动（坐下 / 闯红灯） &nbsp;·&nbsp;
        <kbd>Esc</kbd> 暂停 &nbsp;·&nbsp; <kbd>M</kbd> 静音
      </div>
      <div id="loadLine"></div>
      <div class="lvBtns">
        <button class="btn" id="btnStart">第一章 · 上班路</button>
        <button class="btn ghost" id="btnLevel2">第二章 · 格子间</button>
      </div>
      <div id="bestLine"></div>
    </div>
  </div>

  <div id="overlayEnd" class="overlay hidden">
    <div class="endCard">
      <div id="endRank">S</div>
      <div id="endTitle">到公司啦！</div>
      <div id="endDesc"></div>
      <div id="endStats"></div>
      <div class="endBtns">
        <button class="btn small hidden" id="btnNext">进入 第二章</button>
        <button class="btn small hidden" id="btnBonus">我不干了！！让我"睡"会</button>
        <button class="btn small" id="btnRetry">再 试 一 次</button>
        <button class="btn small ghost" id="btnBack">回 到 首 页</button>
      </div>
    </div>
  </div>

  <div id="overlayPause" class="overlay hidden">
    <div class="endCard">
      <div id="endTitle" style="font-size:1.5em;">休息一下 ☾</div>
      <div id="endDesc">暂停中…… 深呼吸，继续保持朦胧。</div>
      <div class="endBtns">
        <button class="btn small" id="btnResume">继 续 走</button>
        <button class="btn small ghost" id="btnQuit">放 弃 今 天</button>
      </div>
    </div>
  </div>

  <div id="overlaySelect" class="overlay hidden">
    <div class="selCard">
      <div id="selHead">选择你的角色 <span id="selChapter"></span></div>
      <div id="selChars">
        <div class="selCharOpt on" id="selChar_m"><canvas width="120" height="150"></canvas><div class="selName">上班族 · 男生</div></div>
        <div class="selCharOpt" id="selChar_f"><canvas width="120" height="150"></canvas><div class="selName">上班族 · 女生</div></div>
      </div>
      <div class="endBtns">
        <button class="btn small" id="selGo">出 发</button>
        <button class="btn small ghost" id="selBack">返 回</button>
      </div>
    </div>
  </div>

  <div id="err"></div>
</div>

<script>
"use strict";
window.onerror = function(msg, src, line){
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = '错误: ' + msg + ' @' + line;
};

/* ---------------- 素材加载进度：全部就绪前不允许出发（在线首访防"素材陆续弹出"） ---------------- */
var ASSETS = { total:0, loaded:0, ready:false, _last:-1, _lastT:Date.now() };
(function(){
  var _Img = window.Image;
  window.Image = function(w,h){
    var img = new _Img(w,h);
    ASSETS.total++;
    img.addEventListener('load', done); img.addEventListener('error', done);
    function done(){ if(!img._ac){ img._ac = 1; ASSETS.loaded++; ASSETS._lastT = Date.now(); if(ASSETS.loaded>=ASSETS.total) ASSETS.ready = true; } }
    return img;
  };
  // 停滞检测：进度连续 10 秒不动视为卡住，兜底放行（游戏有程序绘制兜底）；只要还在下载就耐心等
  setInterval(function(){
    if(ASSETS.ready) return;
    if(ASSETS.loaded !== ASSETS._last){ ASSETS._last = ASSETS.loaded; ASSETS._lastT = Date.now(); }
    else if(Date.now() - ASSETS._lastT > 10000){ ASSETS.ready = true; }
  }, 1000);
})();

/* ================================================================
   让我睡会 · Level 1 —— 半梦半醒上班路
   像素疗愈小品：走路上班，咖啡提神、早餐催眠，
   在"朦胧区"里走完全程就是胜利。
   ================================================================ */

var VW = 480, VH = 270;
var LANE_Y = [190, 202, 214];
var SIDEWALK_TOP = 178, CURB_Y = 224, ROAD_Y = 229;
var WORLD_LEN = 6300, CLEAR_X = 6080, DOOR_X = 6060;   // 路程缩短 1/4（原 8400，中段删去 2100）
var BAND_LO = 35, BAND_HI = 70;
var LIGHT_GREEN = 8, LIGHT_RED = 5, LIGHT_CYCLE = LIGHT_GREEN + LIGHT_RED;
var COP_AT = {0:true, 1:true, 3:true};   // 有交警值守的路口（索引对应 crossings）
var SIT_DRAIN = -7;                      // 坐长椅时每秒清醒度变化

var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var stage = document.getElementById('stage');

var QS = new URLSearchParams(location.search);
var dbgW = QS.get('w') !== null ? parseFloat(QS.get('w')) : null;
var dbgFast = QS.get('fast') ? 3 : 1;
var dbgX = QS.get('x') !== null ? parseFloat(QS.get('x')) : null;

/* ---------------- utils ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mix(c1,c2,t){ return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))]; }
function css(c,a){ return a===undefined ? 'rgb('+c[0]+','+c[1]+','+c[2]+')' : 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pxCircle(cx,cy,r,col){ ctx.fillStyle=col; for(var dy=-r;dy<=r;dy++){ var w=Math.floor(Math.sqrt(r*r-dy*dy)); ctx.fillRect(cx-w,cy+dy,w*2+1,1); } }
function R(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x,y,w,h); }

/* ---------------- resize ---------------- */
function fitStage(){
  var r = stage.getBoundingClientRect();
  stage.style.fontSize = (r.width/40) + 'px';
}
window.addEventListener('resize', fitStage); fitStage();

/* ---------------- audio ---------------- */
var Au = {
  ctx:null, master:null, delay:null, muted:false,
  nextNote:0, melIdx:2, step:0,
  PENT:[261.6,293.7,329.6,392.0,440.0,523.3,587.3],
  init:function(){
    if(this.ctx) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.8;
      this.master.connect(this.ctx.destination);
      this.delay = this.ctx.createDelay(1.0);
      this.delay.delayTime.value = 0.42;
      var fb = this.ctx.createGain(); fb.gain.value = 0.33;
      var wet = this.ctx.createGain(); wet.gain.value = 0.3;
      this.delay.connect(fb); fb.connect(this.delay);
      this.delay.connect(wet); wet.connect(this.master);
      this.nextNote = this.ctx.currentTime + 0.1;
    }catch(e){ this.ctx = null; }
  },
  resume:function(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMute:function(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:0.8; },
  tone:function(f,dur,type,vol,slide,echo){
    if(!this.ctx || this.muted) return;
    try{
      var t0=this.ctx.currentTime;
      var o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t0+dur);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(vol,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(this.master);
      if(echo) g.connect(this.delay);
      o.start(t0); o.stop(t0+dur+0.05);
    }catch(e){}
  },
  noise:function(dur,freq,vol){
    if(!this.ctx || this.muted) return;
    try{
      var t0=this.ctx.currentTime, n=Math.floor(this.ctx.sampleRate*dur);
      var buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      var s=this.ctx.createBufferSource(); s.buffer=buf;
      var f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=1.2;
      var g=this.ctx.createGain(); g.gain.value=vol;
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t0);
    }catch(e){}
  },
  sip:function(){ this.tone(520,0.1,'sine',0.16,140); setTimeout(function(){Au.tone(660,0.14,'sine',0.15,180);},90); },
  eat:function(){ this.noise(0.08,900,0.22); setTimeout(function(){Au.noise(0.07,600,0.18);},110); },
  stumble:function(){ this.tone(300,0.18,'square',0.1,-140); this.noise(0.1,500,0.14); },

  thudRed:function(){ this.tone(180,0.22,'sine',0.13,-60); },
  warnSleepy:function(){ this.tone(220,0.3,'sine',0.08,-30,true); },
  warnAwake:function(){ this.tone(880,0.14,'triangle',0.07,60); },
  whistle:function(){ this.tone(1500,0.12,'square',0.09,-400); setTimeout(function(){Au.tone(1700,0.15,'square',0.09,-500);},150); },
  failSleep:function(){ var f=[392,330,262,196]; for(var i=0;i<4;i++){ (function(i){ setTimeout(function(){Au.tone(f[i],0.5,'sine',0.14,-15,true);}, i*350); })(i); } },
  failAwake:function(){ var f=[523,659,784,1047]; for(var i=0;i<4;i++){ (function(i){ setTimeout(function(){Au.tone(f[i],0.28,'triangle',0.12,0,true);}, i*160); })(i); } },
  clear:function(){ var f=[523,587,659,784,1047]; for(var i=0;i<5;i++){ (function(i){ setTimeout(function(){Au.tone(f[i],0.35,'triangle',0.13,0,true);}, i*140); })(i); } },
  tickBGM:function(){
    if(!this.ctx || this.muted) return;
    var ct=this.ctx.currentTime;
    while(this.nextNote < ct + 0.25){
      var t=this.nextNote;
      this.step++;
      if(Math.random()<0.72){
        this.melIdx = clamp(this.melIdx + (Math.random()<0.5?-1:1) * (Math.random()<0.25?2:1), 0, 6);
        var f = this.PENT[this.melIdx];
        this.schedNote(f, t, 1.15, 'triangle', 0.055);
        this.schedNote(f/2, t, 1.3, 'sine', 0.035);
      }
      if(this.step % 8 === 0){
        this.schedNote(this.PENT[0]/2, t, 2.2, 'sine', 0.03);
        this.schedNote(this.PENT[2]/2, t, 2.2, 'sine', 0.022);
      }
      this.nextNote += 0.62;
    }
  },
  schedNote:function(f,t,dur,type,vol){
    try{
      var o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(vol,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(this.master); g.connect(this.delay);
      o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
};

function inCrossing(x, m){
  for(var i=0;i<crossings.length;i++){ var c=crossings[i]; if(x>c.x-(m||0) && x<c.x+96+(m||0)) return true; }
  return false;
}

  clouds=[]; for(var ci=0;ci<7;ci++) clouds.push({x:r2()*560, y:14+r2()*60, w:0.7+r2()*0.9, spd:2+r2()*4});

}

var keys = {};
window.addEventListener('keydown', function(e){
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0) e.preventDefault();
  if(e.repeat) return;
  keys[e.key] = true;
  var k = e.key.toLowerCase();
  if(G.state==='bonus'){
    if(k==='m'){ toggleMute(); return; }
    if(e.key==='Escape') finishBonus();
    else bonusAdvance();
    return;
  }
  if(G.state==='intro'){ if(k!=='m') finishIntro(); else toggleMute(); return; }
  if(G.state==='title'){ openSelect(1); return; }
  if(G.state==='end'){ if(e.key===' '||e.key==='Enter'||k==='r') retryGame(); return; }
  if(G.state==='play'){
    if(G.level===2){
      if(e.key===' '){ l2key('sleep'); }
      else if(k==='s'){ l2key('slack'); }
      else if(e.key==='Escape'){ togglePause(); }
      else if(k==='m'){ toggleMute(); }
    } else {
      if(e.key==='ArrowUp'||k==='w'){ laneMove(-1); }
      else if(e.key==='ArrowDown'||k==='s'){ laneMove(1); }
      else if(e.key==='Escape'){ togglePause(); }
      else if(k==='m'){ toggleMute(); }
      else if(e.key===' '){ interact(); }
    }
  } else if(G.state==='pause'){
    if(e.key==='Escape'||e.key===' ') togglePause();
    else if(k==='m'){ toggleMute(); }
  }
});
window.addEventListener('keyup', function(e){ keys[e.key]=false; });

stage.addEventListener('pointerdown', function(e){
  if(e.target.tagName==='BUTTON' || e.target.id==='muteBtn') return;
  Au.init(); Au.resume();
  if(G.state==='bonus'){ bonusAdvance(); return; }
  if(G.state==='intro'){ finishIntro(); return; }
  if(G.state==='title'){ openSelect(1); return; }
  if(G.state!=='play') return;
  var r = stage.getBoundingClientRect();
  var ry = (e.clientY - r.top) / r.height;
  if(G.level===2){
    l2key(ry < 0.5 ? 'sleep' : 'slack');
    return;
  }
  laneMove(ry < 0.5 ? -1 : 1);
});

function laneMove(d){
  if(G.state!=='play' && G.state!=='clearing') return;
  if(G.char.sitting) standUp();
  var nl = clamp(G.char.lane + d, 0, 2);
  if(nl !== G.char.lane){ G.char.lane = nl; }
}

/* ---- 互动：长椅打盹 / 闯红灯 ---- */
function interact(){
  if(G.state!=='play') return;
  if(G.char.sitting){ standUp(); return; }
  if(G.waitingCross!==null){ tryJaywalk(); return; }
  sitOnBench();
}
function sitOnBench(){
  if(G.benchNear===null || G.char.sitting) return;
  G.char.sitting = true;
  G.char.sitBench = G.benchNear;
  G.char.x = G.benchNear;
  G.char.lane = 2; G.char.y = LANE_Y[2];
  hintOnce('bench2','坐着会更困……<b>再按 空格</b> 起来继续走');
}
function standUp(){
  if(!G.char.sitting) return;
  G.char.sitting = false;
  G.char.sitBench = null;
}
function tryJaywalk(){
  if(G.waitingCross===null) return;
  var idx = G.waitingCross;
  G.waitingCross = null;
  G.jayCross = idx;
  if(COP_AT[idx]){
    G.pendingCatch = crossings[idx].x + 30;
    hintOnce('jay2','闯红灯……<b>前面有交警！</b>');
  } else {
    G.wake = clamp(G.wake+6, 0, 100);
    G.char.coffeeT = Math.max(G.char.coffeeT, 0.5);
    fText(G.char.x, G.char.y-30, '+6', '#f2904a');
    hintOnce('jay1','趁交警不在，悄悄溜过去了……心跳加速，<b>清醒 +6</b>');
  }
}

    stats.innerHTML = '朦胧值 <b>'+sc+'</b><br>朦胧率 <b>'+Math.floor(rate*100)+'%</b><br>走到了 <b>'+Math.floor(clamp(G.char.x/CLEAR_X,0,1)*100)+'%</b> 的路';
    rank.textContent='Z'; rank.style.color='#8fb0e8';
    if(sc>G.best){ G.best=sc; try{localStorage.setItem('rangwoshui_best',''+sc);}catch(e){} }
  } else if(G.failType==='awake'){
    title.textContent = '梦醒了。';
    desc.innerHTML = '太阳完全升起，你彻底清醒了。<br>那份半梦半醒的舒服劲儿，再也找不到了。';
    stats.innerHTML = '朦胧值 <b>'+sc+'</b><br>朦胧率 <b>'+Math.floor(rate*100)+'%</b><br>走到了 <b>'+Math.floor(clamp(G.char.x/CLEAR_X,0,1)*100)+'%</b> 的路';
    rank.textContent='☀'; rank.style.color='#f2904a';
    if(sc>G.best){ G.best=sc; try{localStorage.setItem('rangwoshui_best',''+sc);}catch(e){} }
  } else {
    title.textContent = '到公司啦！';
    var rk='C', rkc='#b8b0a2';
    if(rate>=0.75){ rk='S'; rkc='#f2cf8a'; } else if(rate>=0.6){ rk='A'; rkc='#8ad4b0'; } else if(rate>=0.45){ rk='B'; rkc='#8fb0e8'; }
    desc.innerHTML = '你带着一整份朦胧，准时踏进了公司大门。<br>今天，也会是柔软的一天。';
    stats.innerHTML = '朦胧值 <b>'+sc+'</b><br>朦胧率 <b>'+Math.floor(rate*100)+'%</b><br>用时 <b>'+fmtTime(G.totalT)+'</b><br>最佳 <b>'+Math.max(G.best,sc)+'</b>';
    rank.textContent=rk; rank.style.color=rkc;
    if(sc>G.best){ G.best=sc; try{localStorage.setItem('rangwoshui_best',''+sc);}catch(e){} }
    // 通关第一章：解锁第二章
    G.l2unlocked = true;
    try{ localStorage.setItem('rangwoshui_l2','1'); }catch(e){}
    btnNext.classList.remove('hidden');
    btnBonus.classList.remove('hidden');   // 睡神结局入口
  }
  G.state='end';
  ovEnd.classList.remove('hidden');
}

/* ---------------- update ---------------- */
function lightGreen(ci, t){ return ((t + crossings[ci].ph) % LIGHT_CYCLE) < LIGHT_GREEN; }

function update(dt){
  G.t += dt;
  if(G.state==='title'){ if(!TITLEBG.ready) updateDemo(dt); return; }
  if(G.state==='intro'){ updateIntro(dt); Au.tickBGM(); return; }
  if(G.state==='bonus'){ updateBonus(dt); return; }
  if(G.state==='outro2'){ updateOutro2(dt); return; }
  if(G.state==='pause') return;
  if(G.level===2){ update2(dt); return; }
  if(G.state==='end'){ updateParts(dt); return; }
  if(G.state==='failing'){
    G.char.failT += dt;
    var p = G.char;
    if(G.failType==='sleep' && Math.random()<dt*4) pZzz(p.x-2, p.y-30, true);
    if(G.char.failT > 1.7) finishToOverlay();
    updateParts(dt);
    G.camX = clamp(G.char.x-150, 0, WORLD_LEN-VW+40);
    return;
  }
  if(G.state==='clearing'){
    G.char.clearT += dt;
    G.char.animT += dt;
    if(Math.random()<dt*14) pSpark(G.char.x+(Math.random()-0.5)*26, G.char.y-20-Math.random()*20, Math.random()<0.5?'#ffe9b0':'#f2a7c3', 2);
    if(G.char.clearT > 1.9) finishToOverlay();
    updateParts(dt);
    return;
  }

  // ---- play
  var c = G.char;
  G.runT += dt; G.totalT += dt;
  c.animT += dt;
  c.blinkT -= dt; if(c.blinkT < -0.14) c.blinkT = 2 + Math.random()*3;

  var prog = clamp(c.x / CLEAR_X, 0, 1);
  var fast = dbgFast;

  // lane y
  var ty = LANE_Y[c.lane];
  if(Math.abs(c.y-ty) > 0.5){
    c.laneTilt = clamp((ty-c.y)*0.012, -0.1, 0.1);
    c.y += clamp(ty-c.y, -150*dt, 150*dt);
  } else { c.y = ty; c.laneTilt *= 0.8; }

  // traffic light
  var stopped = false;
  if(G.waitingCross !== null){
    var cr = crossings[G.waitingCross];
    if(lightGreen(G.waitingCross, G.runT)){
      G.waitingCross = null;
      Au.dingGreen();
      hintOnce('green1','<b>绿灯啦</b>，继续走吧');
    } else {
      stopped = true;
      G.waitingT += dt;
      if(Math.random()<dt*1.6) pZzz(c.x-3, c.y-24, false);
    }
  }
  if(!stopped){
    for(var i=0;i<crossings.length;i++){
      var crx = crossings[i].x - 16;
      if(c.x < crx && c.x + (27+0.36*G.wake)*fast*dt >= crx && !lightGreen(i, G.runT)){
        c.x = crx; G.waitingCross = i; G.waitingT = 0;
        stopped = true;
        Au.thudRed();
        hintOnce('red_'+i,'红灯了……站着会更困。<b>空格＝闯红灯</b>（有交警的路口会被罚款！）');
        break;
      }
    }
  }

  // benches
  if(!G.demo){
    for(var fb=0;fb<2;fb++){
      var fbx = 3600 + fb*10 - 5;
      if(Math.abs(fbx - G.char.x) < 150 && !G.hints['friend1']){
        G.hints['friend1'] = true;
        hintOnce('friend1','前方遇到了<b>朋友</b>——打个招呼再走吧');
      }
    }
    G.benchNear = null;
    for(var bi2=0; bi2<benches.length; bi2++){
      var bnx = benches[bi2];
      var dxb = bnx - c.x;
      if(dxb>0 && dxb<130) hintOnce('bench1','前面有<b>长椅</b>：走到最外侧车道，按 <b>空格</b> 坐下歇一会');
      if(Math.abs(dxb)<55 && c.lane===2 && !c.sitting) G.benchNear = bnx;
    }
  }

  // movement
  var speed = (27 + 0.36*G.wake)
    * (c.coffeeT>0 ? 1.28 : 1)
    * (c.eatT>0 ? 0.55 : 1)
    * (c.stumbleT>0 ? 0.35 : 1)
    * fast;
  if(stopped || c.sitting || G.fineT>0) speed = 0;
  c.moving = speed > 1;
  c.x += speed * dt;
  if(c.moving) c.phase += speed*dt*0.34;

  // step sfx
  if(c.moving){
    var ph2 = c.phase % (Math.PI*2);
    if(ph2 < 0.35 && !c._stepped){ Au.noise(0.03, 300, 0.05); c._stepped = true; }
    if(ph2 > Math.PI) c._stepped = false;
  }

  // timers
  if(c.coffeeT>0) c.coffeeT -= dt;
  if(c.eatT>0) c.eatT -= dt;
  if(c.stumbleT>0) c.stumbleT -= dt;

  // wake
  var drift = stopped ? -3.6 : (1.0 + 0.55*prog);
  if(c.sitting) drift = SIT_DRAIN;
  G.wake = clamp(G.wake + drift*dt, 0, 100);

  // jaywalk caught by cop
  if(!G.demo && G.pendingCatch!==null && c.x >= G.pendingCatch){
    G.pendingCatch = null;
    G.fineT = 1.2; G.fineShow = 1.8; G.fineCross = G.jayCross;
    G.wake = clamp(G.wake+15, 0, 100);
    Au.whistle();
    pSpark(c.x, c.y-22, '#ff8d8d', 10);
    fText(c.x, c.y-38, '罚款! +15', '#ff8d8d');
    hintOnce('caught','被交警逮住了！紧张得瞬间清醒——<b>清醒 +15</b>');
  }
  if(G.fineT>0) G.fineT -= dt;
  if(G.fineShow>0) G.fineShow -= dt;

  // sitting on bench
  if(c.sitting){
    if(Math.random()<dt*(G.wake<40?1.3:0.6)) pZzz(c.x-2, c.y-34, G.wake<25);
    if(G.wake<=2){ endRun('sleep'); return; }
  }

  // score
  if(G.wake>=BAND_LO && G.wake<=BAND_HI){
    G.bandT += dt; G.score += 10*dt;
    if(Math.random()<dt*2.2) pBand(c.x-6, c.y-14-Math.random()*10);
    hintOnce('band','保持在<b>粉色朦胧区</b>里，就能攒朦胧值！');
  }

  // items
  for(var ii=0;ii<items.length;ii++){
    var it = items[ii];
    if(it.taken) continue;
    if(Math.abs(it.x - c.x) < 9 && it.lane === c.lane){
      it.taken = true;
      if(G.demo) continue;
      if(it.type==='coffee'){
        G.wake = clamp(G.wake+26, 0, 100);
        c.coffeeT = 1.2;
        Au.sip(); pSpark(it.x, LANE_Y[it.lane]-14, '#f2b04a', 8);
        fText(it.x, LANE_Y[it.lane]-26, '+26', '#f2b04a');
        hintOnce('coffee','<b>咖啡</b>：精神 +26，脚步变快');
      } else {
        G.wake = clamp(G.wake-20, 0, 100);
        c.eatT = 0.85;
        Au.eat(); pSpark(it.x, LANE_Y[it.lane]-14, '#f2e6cf', 7);
        fText(it.x, LANE_Y[it.lane]-26, 'Zz -20', '#a9c3e8');
        hintOnce('food','<b>早餐</b>：困意 +20，走得更慢——用来压住清醒');
      }
    }
  }

  // puddles
  if(!G.demo && c.stumbleT<=0){
    for(var pi=0;pi<puddles.length;pi++){
      var pd = puddles[pi];
      if(Math.abs(pd.x-c.x)<7 && pd.lane===c.lane){
        c.stumbleT = 0.7; G.shake = 0.3;
        G.wake = clamp(G.wake-2, 0, 100);
        Au.stumble(); pSplash(pd.x, LANE_Y[pd.lane]);
        fText(pd.x, LANE_Y[pd.lane]-26, '哎呀!', '#fdf6e3');
      }
    }
  }

  // warnings & fails
  if(!G.demo){
    if(G.wake<=2){ endRun('sleep'); return; }
    if(G.wake>=98){ endRun('awake'); return; }
    if(G.wake<18){
      G.warnedSleepy += dt;
      if(G.warnedSleepy > 2){ G.warnedSleepy = 0; Au.warnSleepy(); }
      hintOnce('ws','<b>好困……</b>再睡过去就完了！找杯咖啡！');
    } else G.warnedSleepy = 0;
    if(G.wake>82){
      G.warnedAwake += dt;
      if(G.warnedAwake > 2){ G.warnedAwake = 0; Au.warnAwake(); }
      hintOnce('wa','<b>太清醒了！</b>梦要醒了——快吃点早餐，或找把<b>长椅</b>坐一会！');
    } else G.warnedAwake = 0;
  }

  // sleepy zzz while walking
  // 打瞌睡 Zzz:上班路上一直冒,越困越频繁
  if(Math.random() < dt*(G.wake<18?1.6:(G.wake<40?1.2:0.8))) pZzz(c.x-4, c.y-24, G.wake<18);

  // arrive
  if(!G.demo && c.x >= CLEAR_X){ c.x = CLEAR_X; doClear(); return; }

  // demo loop
  if(G.demo){
    if(c.x > 5880){ G.demoFade = 1; c.x = 120; }
    if(G.demoFade>0) G.demoFade -= dt*2;
    // demo lane wander
    if(Math.random()<dt*0.5) c.lane = Math.floor(Math.random()*3);
  }

  // ambient
  birdTimer -= dt;
  if(birdTimer<=0){
    birdTimer = 8 + Math.random()*9;
    var fromLeft = Math.random()<0.5;
    birds.push({x:fromLeft?-20:VW+20, y:30+Math.random()*70, vx:fromLeft?20:-22, ph:Math.random()*6});
  }
  for(var bi=birds.length-1;bi>=0;bi--){
    var b=birds[bi]; b.x += b.vx*dt; b.ph += dt*9;
    if(b.x<-30||b.x>VW+30) birds.splice(bi,1);
  }
  if(Math.random()<dt*1.4){
    var tr = props[Math.floor(Math.random()*props.length)];
    if(tr.t==='tree') pLeaf(tr.x+8, SIDEWALK_TOP-30);
  }
  for(var pi2=0;pi2<props.length;pi2++){
    var pp = props[pi2];
    if(pp.t==='stall' && Math.abs(pp.x-G.camX-240)<300 && Math.random()<dt*3) pSteam(pp.x-10, SIDEWALK_TOP-32);
    if(pp.t==='kiosk' && Math.abs(pp.x-G.camX-240)<300 && Math.random()<dt*1.6) pSteam(pp.x-2, SIDEWALK_TOP-46, true);
    if(pp.t==='flower' && Math.random()<dt*0.5) pPetal(pp.x, SIDEWALK_TOP-20);
    if(pp.t==='cat' && Math.abs(pp.x-G.camX-240)<300 && Math.random()<dt*0.8) pZzz(pp.x+8, 202, false);
  }

  // timers on particles
  updateParts(dt);

  // camera
  var targetCam = clamp(c.x - 150 + speed*0.22, 0, WORLD_LEN - VW + 40);
  G.camX += (targetCam - G.camX) * Math.min(1, dt*6);
  if(G.shake>0) G.shake -= dt;

  Au.tickBGM();
}

function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.t==='steam'||p.t==='band'){ p.x += Math.sin(G.t*4+p.ph)*8*dt; p.life -= dt*0.9; }
    else if(p.t==='zzz'){ p.x += 6*dt; p.vy -= 4*dt; p.life -= dt*0.75; }
    else if(p.t==='spark'){ p.vy += 60*dt; p.life -= dt*1.6; }
    else if(p.t==='drop'){ p.vy += 160*dt; p.life -= dt*1.5; }
    else if(p.t==='leaf'){ p.x += Math.sin(G.t*2+p.ph)*12*dt; p.life -= dt*0.55; }
    if(p.life<=0) parts.splice(i,1);
  }
  for(var j=floats.length-1;j>=0;j--){
    var f=floats[j]; f.y -= 14*dt; f.life -= dt;
    if(f.life<=0) floats.splice(j,1);
  }
}

function updateDemo(dt){
  var c = G.char;
  c.animT += dt; c.moving = true;
  var speed = (27 + 0.36*G.wake);
  c.x += speed*dt;
  c.phase += speed*dt*0.34;
  var ty = LANE_Y[c.lane];
  c.y += clamp(ty-c.y, -120*dt, 120*dt);
  if(Math.random()<dt*0.4) c.lane = Math.floor(Math.random()*3);
  if(c.x > 5880){ G.demoFade = 1; c.x = 120; }
  if(G.demoFade>0) G.demoFade -= dt*2;
  if(Math.random()<dt*0.5) pZzz(c.x-4, c.y-24, false);
  updateParts(dt);
  var targetCam = clamp(c.x-150, 0, WORLD_LEN-VW+40);
  G.camX += (targetCam-G.camX)*Math.min(1, dt*4);
  birdTimer -= dt;
  if(birdTimer<=0){ birdTimer = 8+Math.random()*9; birds.push({x:-20,y:30+Math.random()*70,vx:20,ph:0}); }
  for(var bi=birds.length-1;bi>=0;bi--){ var b=birds[bi]; b.x+=b.vx*dt; b.ph+=dt*9; if(b.x>VW+30) birds.splice(bi,1); }
}

/* ================================================================
   RENDER
   ================================================================ */
var SKY_DAWN = [[96,88,150],[236,150,132],[255,205,150],[255,228,180]];
var SKY_DAY  = [[110,175,228],[160,212,240],[200,232,248],[255,238,190]];

function render(){
  if(G.state==='intro' && intro){ renderIntro(); return; }
  if(G.state==='bonus' && BONUS){ renderBonus(); return; }
  if(G.state==='outro2' && O2){ renderOutro2(); return; }
  if(G.state==='title' && TITLEBG.ready){
    // 开屏：静态主视觉 + 底部压暗衬托菜单
    ctx.drawImage(TITLEBG.cv, 0, 0);
    var tg = ctx.createLinearGradient(0,140,0,270);
    tg.addColorStop(0,'rgba(20,14,38,0)'); tg.addColorStop(1,'rgba(20,14,38,0.62)');
    ctx.fillStyle=tg; ctx.fillRect(0,0,480,270);
    return;
  }
  if(G.level===2){ render2(); return; }
  var camX = G.camX;
  var shx=0, shy=0;
  if(G.shake>0){ shx=(Math.random()-0.5)*4; shy=(Math.random()-0.5)*3; }
  var prog = clamp(G.char.x/CLEAR_X, 0, 1);

  // ---- 背景：满铺天空 → 远景剪影(0.15x/0.25x) → 远景楼群(0.3x) → 街道(1x)
  if(SKYGEN.ready){
    ctx.drawImage(SKYGEN.cv, 0, 0);
  } else if(L1BG.ready){
    ctx.drawImage(L1BG.skyCvs, 0, 0);
    ctx.drawImage(L1BG.skyCvs, 0, 140, 480, 2, 0, 142, 480, 36);   // 天空补铺到人行道顶
  } else {
  // ---- sky（旧程序背景兜底）
  var stops=[];
  for(var i=0;i<4;i++) stops.push(mix(SKY_DAWN[i], SKY_DAY[i], prog));
  var g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, css(stops[0])); g.addColorStop(0.45, css(stops[1]));
  g.addColorStop(0.75, css(stops[2])); g.addColorStop(1, css(stops[3]));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  // stars
  var starA = clamp(1-prog*1.8, 0, 1);
  if(starA>0.02){
    for(var si=0;si<stars.length;si++){
      var st=stars[si];
      var a = starA * (0.4 + 0.6*Math.abs(Math.sin(G.t*1.5+st.ph)));
      R(st.x, st.y, 1, 1, 'rgba(255,250,230,'+a.toFixed(2)+')');
    }
  }
  // sun
  var sunY = lerp(118, 38, prog), sunX = VW*0.74;
  var sc1 = mix([255,190,120],[255,244,205],prog);
  ctx.fillStyle = css(sc1, 0.16); pxCircle(sunX, sunY, 16, css(sc1,0.16));
  pxCircle(sunX, sunY, 12, css(sc1,0.3));
  pxCircle(sunX, sunY, 9, css(sc1,0.95));
  // clouds
  for(var ci=0;ci<clouds.length;ci++){
    var cl=clouds[ci];
    var cx = ((cl.x - camX*0.1 + G.t*cl.spd) % (VW+120)) - 60;
    var cc = mix([255,220,205],[255,252,246],prog);
    drawCloud(cx, cl.y, cl.w, css(cc,0.85));
  }
  // birds
  for(var bi=0;bi<birds.length;bi++){
    var b=birds[bi];
    var fy = Math.sin(b.ph)>0 ? 0 : 2;
    R(b.x-3, b.y-fy, 3, 1, '#3a3450'); R(b.x+1, b.y-fy, 3, 1, '#3a3450');
    R(b.x-1, b.y, 3, 1, '#3a3450');
  }

  // ---- mid parallax trees（旧程序背景兜底）
  var mx0 = camX*0.55;
  ctx.save();
  for(var mt=0;mt<midTrees.length;mt++){
    var m=midTrees[mt];
    var sx = m.x - mx0;
    if(sx<-60||sx>VW+60) continue;
    if(m.t==='bush'){
      pxCircle(sx,178-7,7,css(mix([62,84,60],[96,128,92],prog)));
      pxCircle(sx+6,178-5,5,css(mix([70,94,66],[106,140,100],prog)));
    } else {
      R(Math.round(sx)-1,178-10,3,10,'#5c4a3a');
      pxCircle(Math.round(sx),178-16,9,css(mix([62,90,60],[100,138,96],prog)));
      pxCircle(Math.round(sx)-4,178-19,6,css(mix([72,102,68],[112,150,106],prog)));
    }
  }
  ctx.restore();
  }  // end else（旧程序天空兜底）

  // ---- 远景剪影双层：填充楼隙、增加纵深（楼底沉到人行道后衔接街道）
  drawSilLayer(silFar2, 0.15, 188, mix([140,130,175],[190,210,230],prog), 0.5, prog);
  drawSilLayer(silFar, 0.25, 184, mix([110,100,150],[150,175,205],prog), 0.9, prog);

  // ---- 远景楼群（0.3x）：满铺背景，楼底(184)藏在人行道(178 起)后，与街道衔接
  if(FARBLDG.ready){
    var foff = camX * FAR_FAC;
    var frow = getFarRow();
    for(var fbi=0; fbi<frow.length; fbi++){
      var fb = frow[fbi];
      var fbx = fb.x - foff;
      if(fbx + fb.w < -24 || fbx > VW+24) continue;
      ctx.drawImage(FARBLDG.cv, fb.it.sx, fb.it.sy, fb.it.sw, fb.it.sh,
        Math.round(fbx), Math.round(FAR_BASE_Y - fb.h), fb.w, fb.h);
    }
  }

  // ---- world (with shake)
  ctx.save();
  ctx.translate(Math.round(shx), Math.round(shy));

  drawGround(camX, prog);

  // drawables sorted by y
  var draws = [];
  for(var pi=0;pi<props.length;pi++){
    var p=props[pi];
    if(p.x < camX-80 || p.x > camX+VW+80) continue;
    draws.push({y:propY(p), fn:makePropDrawer(p, camX, prog)});
  }
  for(var xi=0;xi<crossings.length;xi++){
    var crx=crossings[xi];
    if(crx.x > camX-140 && crx.x < camX+VW+40){
      draws.push({y:180, fn:(function(cr){return function(){ drawLightPole(cr.x-26-camX, 180, cr, prog); };})(crx)});
      draws.push({y:216, fn:(function(cr){return function(){ drawPedBox(cr.x-4-camX, cr, G.waitingCross===crossings.indexOf(cr)); };})(crx)});

  ctx.restore(); // shake

  // ---- lighting overlays

  }
  // too-awake: warm flare

    R(0,0,VW,VH,'rgba(255,235,190,'+fa.toFixed(3)+')');

  // fail cinematics

    } else {

  }

  // vignette
  var vg = ctx.createRadialGradient(VW/2,VH/2,VH*0.55, VW/2,VH/2,VH*1.05);
  vg.addColorStop(0,'rgba(20,16,40,0)'); vg.addColorStop(1,'rgba(20,16,40,0.36)');

  // demo fade cut
  if(G.demoFade>0) R(0,0,VW,VH,'rgba(10,8,20,'+clamp(G.demoFade,0,1).toFixed(2)+')');
}

function drawCloud(x,y,s,col){
  var w=[7,12,16,12,7];
  ctx.fillStyle=col;
  for(var r=0;r<5;r++){
    var ww = Math.round(w[r]*s);
    ctx.fillRect(Math.round(x-ww/2), Math.round(y+r-2), ww, 1);
  }

function drawSilLayer(list, fac, baseY, col, alpha, prog){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = css(col);
  var off = (G.camX*fac) % 3400;
  for(var i=0;i<list.length;i++){
    var b=list[i];
    var sx = b.x - off;
    if(sx > VW+20) sx -= 3400;
    if(sx + b.w < -20) sx += 3400;
    if(sx > VW+20 || sx+b.w < -20) continue;
    ctx.fillRect(Math.round(sx), baseY-b.h, Math.round(b.w), b.h);
    // roof detail
    ctx.fillRect(Math.round(sx)+3, baseY-b.h-3, Math.round(b.w)-6, 3);
    if(alpha>0.7){
      var litA = clamp(0.5-prog*0.35, 0.05, 0.5);
      var rr = (b.x*7+b.w)%97;
      for(var wy=baseY-b.h+6; wy<baseY-8; wy+=10){
        for(var wx=sx+5; wx<sx+b.w-6; wx+=9){
          if(((wx*13+wy*7+b.win*100)|0)%5 < 2){
            ctx.fillStyle='rgba(255,217,138,'+litA.toFixed(2)+')';
            ctx.fillRect(Math.round(wx), Math.round(wy), 3, 4);
            ctx.fillStyle=css(col);
          }
        }
      }
    }
  }
  ctx.restore();
}

    ctx.fillRect(Math.round(cx-7), SIDEWALK_TOP+2, 3, CURB_Y-SIDEWALK_TOP-4);
  }
}

function propY(p){
  switch(p.t){
    case 'tree': case 'lamp': case 'mail': case 'hydrant': case 'bike': return 186;
    case 'stall': case 'kiosk': case 'news': case 'vend': return 188;
    case 'bench': return 218;
    case 'bus': return 218;
    case 'flower': return 216;
    case 'shop': return 190;
    case 'cat': return 219;
    case 'home': return 178;
    case 'office': return 178;
  }
  return 178;
}

function makePropDrawer(p, camX, prog){
  return function(){
    var sx = Math.round(p.x - camX);
    // 公寓外观（ChatGPT 生成图优先）
    if(p.t==='home' && HOMEIMG.ready){
      var hw4 = 158, hh4 = hw4*HOMEIMG.cvs.height/HOMEIMG.cvs.width;
      ctx.drawImage(HOMEIMG.cvs, Math.round(sx-hw4/2), Math.round(178-hh4), Math.round(hw4), Math.round(hh4));
      return;
    }
    // 公司大楼（ChatGPT 生成图优先）
    if(p.t==='office' && OFFICEIMG.ready){
      var w3 = 350, h3 = w3*OFFICEIMG.cvs.height/OFFICEIMG.cvs.width;
      ctx.drawImage(OFFICEIMG.cvs, Math.round(sx-175), Math.round(178-h3), Math.round(w3), Math.round(h3));
      return;
    }
    // 沿街小店（ChatGPT 生成，同早餐摊一样立在街道边）
    if(p.t==='shop' && SHOPIMG.ready){
      var shp = SHOPIMG.items[(p.e.v||0) % SHOPIMG.items.length];
      var thS = 54, twS = Math.round(shp.sw * thS / shp.sh);
      ctx.drawImage(SHOPIMG.cv, shp.sx, shp.sy, shp.sw, shp.sh,
        Math.round(sx - twS/2), Math.round(propY(p) - thS), twS, thS);
      return;
    }
    // ChatGPT 组件图优先
    var sprN = PROP_MAP[p.t];
    if(sprN && PROPIMG[sprN]){
      var th = PROP_H[sprN], baseY = propY(p);
      var w2 = th*PROPIMG[sprN].width/PROPIMG[sprN].height;
      ctx.drawImage(PROPIMG[sprN], Math.round(sx-w2/2), Math.round(baseY-th), Math.round(w2), Math.round(th));
      return;
    }
    switch(p.t){
      case 'tree': drawTree(sx, 186, p.e.s, prog); break;
      case 'lamp': drawLamp(sx, 180, prog); break;
      case 'stall': drawStall(sx); break;
      case 'kiosk': drawKiosk(sx); break;
      case 'bench': drawBench(sx); break;
      case 'news': drawNews(sx); break;
      case 'vend': drawVend(sx); break;
      case 'bus': drawBus(sx); break;
      case 'cat': drawCat(sx); break;
      case 'flower': drawFlower(sx); break;
      case 'mail': drawMail(sx); break;
      case 'hydrant': drawHydrant(sx); break;
      case 'bike': drawBike(sx); break;
      case 'home': drawHome(sx, prog); break;
      case 'office': drawOffice(sx, prog); break;
    }
  };
}

/* ---- 设定图精灵版主角（第一章） ---- */
function drawCharSpr(sx, sy, c){
  var pspr = function(n){ return poseSpr(CHAR_SEL.c, n) || CHSPR[CHAR_SEL.c+'_'+n] || null; };
  var walk = function(i){ return CHSPR[CHAR_SEL.c+'_right'+i] || null; };
  var t = c.animT;
  var S = function(spr, h, dx, dy){
    if(!spr) return false;
    var w = h*spr.width/spr.height;
    ctx.drawImage(spr, Math.round(sx+dx-w/2), Math.round(sy+dy-h), Math.round(w), Math.round(h));
    return true;
  };
  if(c.pose==='sleep'){
    if(!S(pspr('tired'), 32, 0, -4)) drawCharSleep(sx, sy);
    return;
  }
  if(c.pose==='stretch'){
    if(!S(pspr('happy'), 34, 0, -4)) drawCharStretch(sx, sy, c);
    return;
  }
  var bob = c.moving ? 0 : Math.round(Math.sin(t*2)*0.8);
  if(c.pose==='hop') bob = -Math.abs(Math.sin(c.clearT*7))*6;
  // 红灯等待久了看手表（小彩蛋）
  if(G.waitingCross!==null && G.waitingT>4 && S(pspr('watch'), 34, 0, bob-2)) return;
  // 新行走表：右行 8 帧完整步态；头部中轴对准行进位置、脚底对齐基线，统一比例
  var wk = WALKSHEETS[CHAR_SEL.c];
  if(wk.ready && wk.rows.right){
    var row = c.moving ? wk.rows.right : (wk.rows.front || wk.rows.right);
    var sc = 36/row.baseH;
    var n = row.frames.length;
    var fi = c.moving ? (Math.floor(c.phase/2.4) % n) : 0;
    var fr = row.frames[fi];
    var ax = fr[4] !== undefined ? fr[4] : fr[2]/2;
    ctx.drawImage(wk.img, fr[0],fr[1],fr[2],fr[3],
      Math.round(sx - ax*sc),
      Math.round(sy - fr[3]*sc + bob),   // 每帧包围盒底边钉在脚底基线，帧底不齐也不会上下跳动
      Math.round(fr[2]*sc), Math.round(fr[3]*sc));
    return;
  }
  // 旧表兜底
  var frame;
  if(c.moving){
    frame = walk(Math.floor(c.phase/1.1) % 7);
  } else {
    frame = CHSPR[CHAR_SEL.c+'_down0'] || walk(0);
  }
  if(!frame) frame = pspr('big');
  if(!S(frame, 36, 0, bob-2)) drawChar(sx, sy, c);
}

function drawChar(sx, sy, c){
  var w = G.wake;
  var t = c.animT;
  var s = clamp((55-w)/45, 0, 1);   // sleepiness
  var alert = clamp((w-65)/30, 0, 1);

  if(c.pose==='sleep'){ drawCharSleep(sx, sy); return; }
  if(c.pose==='stretch'){ drawCharStretch(sx, sy, c); return; }

  var sway = Math.sin(t*3.1)*0.13*s + Math.sin(t*0.9)*0.03;
  if(c.pose==='wait') sway = Math.sin(t*1.7)*0.07 + 0.04*s;
  if(c.stumbleT>0) sway += 0.18*Math.sin(c.stumbleT*24);
  var bob = c.moving ? -Math.abs(Math.sin(c.phase))*1.4 : Math.sin(t*2)*0.6;
  var hop = 0;
  if(c.pose==='hop') hop = -Math.abs(Math.sin(c.clearT*7))*7;

  ctx.save();
  ctx.translate(sx, sy+hop);
  ctx.rotate(sway + (c.laneTilt||0));
  if(c.stumbleT>0 && Math.floor(c.stumbleT*16)%2===0){ ctx.restore(); return; }

  var lp = Math.sin(c.phase), lp2 = Math.sin(c.phase+Math.PI);
  var stA = c.moving ? Math.round(lp*1.6) : 0;
  var stB = c.moving ? Math.round(lp2*1.6) : 0;
  if(c.pose==='wait'){ stA = stB = 0; }

  // back arm
  R(-5, -13+Math.round(lp2*1.4), 2, 6, P_SHIRTS);
  R(-5, -7+Math.round(lp2*1.4), 2, 1, P_SKIN);
  // legs
  R(-3+stA, -6, 3, 5, P_PANTS);
  R(-3+stA+(stA>0?1:0), -2, 4, 2, P_SHOE);
  R(0+stB, -6, 3, 5, P_PANTS);
  R(0+stB+(stB>0?1:0), -2, 4, 2, P_SHOE);
  // torso
  R(-4, -14, 8, 9, P_SHIRT);
  R(-3, -11, 1, 1, P_SHIRTS); R(1, -8, 1, 1, P_SHIRTS); R(-1, -6, 1, 1, P_SHIRTS);
  // tie
  R(0, -14, 2, 1, P_TIE);
  R(0, -13, 1, 5, P_TIE);
  // front arm + bag
  var fa = Math.round(lp*1.4);
  R(4, -13+fa, 2, 6, P_SHIRT);
  R(4, -7+fa, 2, 1, P_SKIN);
  R(3, -7+Math.round(fa*0.5), 5, 6, P_BAG);
  R(3, -7+Math.round(fa*0.5), 5, 1, '#6e5238');
  // head
  R(-4, -22, 8, 8, P_SKIN);
  // hair
  R(-4, -23, 8, 3, P_HAIR);
  R(-4, -20, 3, 5, P_HAIR);
  R(1, -20, 2, 1, P_HAIR);
  R(3, -24, 1, 1, P_HAIR);
  R(-5, -21, 1, 2, P_HAIR);
  // eye
  var blinking = c.blinkT < 0.12;
  if(w < 22 || blinking){
    R(1, -18, 2, 1, P_EYE);
  } else if(w < 45){

      ctx.fillRect(sx, sy, sz, sz);

      ctx.font = (p.big?'bold 10px':'8px')+' monospace';
      ctx.fillStyle = 'rgba(200,215,255,'+clamp(p.life,0,1).toFixed(2)+')';
      ctx.fillText('Z', sx, sy);
    } else if(p.t==='spark'){
      ctx.fillStyle = p.col;
      ctx.globalAlpha = clamp(p.life*1.8,0,1);
      ctx.fillRect(sx, sy, 2, 2);
      ctx.globalAlpha = 1;
    } else if(p.t==='band'){
      var a2 = clamp(p.life,0,1)*0.8;
      ctx.fillStyle = 'rgba(242,167,195,'+a2.toFixed(2)+')';
      var tw = Math.sin(G.t*6+p.ph)>0?2:1;

      ctx.fillStyle='rgba(140,170,215,'+clamp(p.life*1.6,0,1).toFixed(2)+')';

      ctx.globalAlpha = clamp(p.life,0,1);

      ctx.globalAlpha=1;

function orientRight(c){
  // 检测头部的肤色偏向：偏左则水平镜像，统一为朝右
  try{
    var W=c.width, H=c.height;
    var g=c.getContext('2d');
    var id=g.getImageData(0,0,W,H), d=id.data;
    var sx=0, sn=0;
    for(var y=0;y<H*0.45;y++){
      for(var x=0;x<W;x++){
        var p=(y*W+x)*4;
        if(d[p+3]<200) continue;
        var r=d[p], gg=d[p+1], b=d[p+2];
        if(r>=225 && r-gg>=30 && gg-b>=25 && r-b>=70){ sx+=x; sn++; }
      }
    }
    if(sn<3) return c;
    if(sx/sn < W/2 + 2){
      var c2=document.createElement('canvas'); c2.width=W; c2.height=H;
      var g2=c2.getContext('2d');
      g2.translate(W,0); g2.scale(-1,1);
      g2.drawImage(c,0,0);
      return c2;
    }
  }catch(e){}
  return c;
}
function cropSprite(img, r, mirror){
  var c = document.createElement('canvas'); c.width=r[2]; c.height=r[3];
  var g = c.getContext('2d');
  if(mirror){ g.translate(r[2],0); g.scale(-1,1); }
  g.drawImage(img, r[0],r[1],r[2],r[3], 0,0,r[2],r[3]);
  // 从边缘泛洪抠除纸色背景（不碰角色内部的相近色）
  try{
    var W=c.width, H=c.height;
    var id = g.getImageData(0,0,W,H), d = id.data;
    // 背景色候选 = 四角像素（某角被污染时其余角仍可工作）+ 标准纸色兜底
    var cs = [0, (W-1)*4, (H-1)*W*4, ((H-1)*W+W-1)*4];
    var corners = cs.map(function(p){ return [d[p], d[p+1], d[p+2]]; });
    corners.push([233,221,201]);
    function isBg(p){
      for(var ci=0;ci<corners.length;ci++){
        var dr=d[p]-corners[ci][0], dg=d[p+1]-corners[ci][1], db=d[p+2]-corners[ci][2];
        if(dr*dr+dg*dg+db*db < 1800) return true;
      }
      return false;
    }
    var visited = new Uint8Array(W*H);
    var qx = new Int32Array(W*H), qy = new Int32Array(W*H), head=0, tail=0;
    function tryPush(xx,yy){
      var idx = yy*W+xx;
      if(visited[idx]) return;
      if(!isBg(idx*4)) return;
      visited[idx]=1; qx[tail]=xx; qy[tail]=yy; tail++;
    }
    for(var x0=0;x0<W;x0++){ tryPush(x0,0); tryPush(x0,H-1); }
    for(var y0=0;y0<H;y0++){ tryPush(0,y0); tryPush(W-1,y0); }
    while(head<tail){
      var cx2=qx[head], cy2=qy[head]; head++;
      var p2=(cy2*W+cx2)*4;
      d[p2+3]=0;
      if(cx2>0) tryPush(cx2-1,cy2);
      if(cx2<W-1) tryPush(cx2+1,cy2);
      if(cy2>0) tryPush(cx2,cy2-1);
      if(cy2<H-1) tryPush(cx2,cy2+1);
    }
    g.putImageData(id,0,0);
  }catch(e){}
  return c;
}

function msg2(x,y,txt,col){ L2.msgs.push({x:x,y:y,txt:txt,col:col,life:1.6}); }

function startSlack2(){
  var i;
  do{ i = Math.floor(Math.random()*ACTS2.length); }while(i===L2.slackIdx && ACTS2.length>1);
  L2.slackIdx=i; L2.slackType=ACTS2[i].id; L2.pState='slack';

function l2key(kind){
  if(G.state!=='play') return;
  if(L2.leader.state==='scold') return;   // 训话中动弹不得
  // 警报中的应急键：无论按什么都立刻切回工作（惊险逃脱）
  if(L2.leader.state==='alert' && L2.pState!=='work'){
    L2.pState='work'; L2.slackType=null;
    L2.leader.state='walk'; L2.leader.st=0; L2.leader.stateDur=1.4+Math.random()*1.4;
    msg2(Math.round(SEAT2.x)-30, Math.round(SEAT2.y)-34, '好险!', '#ffe9b0');

  }
  if(kind==='sleep'){
    L2.pState = (L2.pState==='sleep') ? 'work' : 'sleep';
    if(L2.pState==='sleep') L2.slackType = null;
  } else {
    if(L2.pState==='slack'){ L2.pState='work'; L2.slackType=null; }
    else startSlack2();
  }
}

function updateLeader2(dt, diff){
  var L = L2.leader;
  L.st += dt;
  var speed = 44 + 30*diff;
  if(L.state==='walk'){
    var tp = L2PTS[L.tgt];
    var dx = tp[0]-L.x, dy = tp[1]-L.y;
    var d = Math.hypot(dx,dy);
    if(d < speed*dt + 0.5){
      L.x = tp[0]; L.y = tp[1];
      arriveAtNode2(L, diff);
    } else {
      L.x += dx/d*speed*dt; L.y += dy/d*speed*dt;
      L.face = {x:dx/d, y:dy/d};
    }
  } else if(L.state==='scan'){
    // 原地慢慢转身环视
    L.angle += dt*(1.5 + diff*0.7);
    L.face = {x:Math.cos(L.angle), y:Math.sin(L.angle)};
    if(L.st>L.stateDur) startWalk2(L, diff);
  } else if(L.state==='away'){
    // 背对玩家（看向别处）
    var ax = L.x-SEAT2.x, ay = L.y-SEAT2.y, ad = Math.hypot(ax,ay)||1;
    L.face = {x:ax/ad, y:ay/ad};
    if(L.st>L.stateDur) startWalk2(L, diff);
  } else if(L.state==='detained'){
    if(L.st>L.stateDur) startWalk2(L, diff);
  } else if(L.state==='scold'){
    var sx = SEAT2.x-L.x, sy = SEAT2.y-L.y, sd = Math.hypot(sx,sy)||1;
    L.face = {x:sx/sd, y:sy/sd};
    if(L.st>L.stateDur) startWalk2(L, diff);
  }
  // 'alert' 状态冻结：面向玩家，由玩家反应或抓捕结算处理
}
function arriveAtNode2(L, diff){
  L.node = L.tgt;
  var r = Math.random();
  if(r<0.5){ startWalk2(L, diff); }
  else if(r<0.85){ L.state='scan'; L.st=0; L.angle=Math.atan2(L.face.y,L.face.x); L.stateDur=lerp(3.4,2.3,diff)+Math.random()*0.8; }
  else { L.state='away'; L.st=0; L.stateDur=lerp(4.4,2.9,diff)+Math.random(); }
}
function startWalk2(L, diff){
  var opts = L2GRAPH[L.node].filter(function(n){ return n!==L.from; });
  if(opts.length===0) opts = L2GRAPH[L.node];
  var nxt = opts[Math.floor(Math.random()*opts.length)];
  L.from = L.node; L.tgt = nxt; L.state='walk'; L.st=0;
}
function coneHitsPlayer2(){
  var L = L2.leader;
  if(L.state==='alert'||L.state==='scold') return true;
  if(L.state==='away'||L.state==='detained') return false;
  var dx = SEAT2.x-L.x, dy = SEAT2.y-L.y;
  var d = Math.hypot(dx,dy);
  if(d>84) return false;
  var a = Math.atan2(dy,dx), fa = Math.atan2(L.face.y, L.face.x);
  var dd = Math.abs(a-fa); if(dd>Math.PI) dd = Math.PI*2-dd;
  return dd < 0.78;   // 约45°半角
}
function leaderVisible2(){
  var s = L2.leader.state;
  if(s==='alert'||s==='scold') return true;
  if(s==='away'||s==='detained') return false;
  return coneHitsPlayer2();
}

function update2(dt){
  if(G.state==='end') return;
  if(G.state==='failing'){
    L2.failT += dt;
    if(L2.failT>1.6) finishToOverlay2();
    return;
  }
  L2.t += dt;
  L2.dayT += dt;
  var diff = clamp(L2.dayT/L2.DAY_LEN, 0, 1);

  updateLeader2(dt, diff);
  var vis = leaderVisible2();
  if(!vis) hintOnce('l2safe','<b>死角！</b>空格＝趴桌睡觉，S＝摸鱼——领导回来前记得切回工作');

  // 玩家状态效果
  if(L2.pState==='work'){
    L2.wake += 1.1*dt;
    L2.typeT -= dt;
    if(L2.typeT<=0){ L2.typeT = 0.16+Math.random()*0.14; Au.noise(0.02, 1400, 0.014); }
  } else if(L2.pState==='sleep'){
    L2.wake -= 9*dt;
  } else {
    var act = ACTS2[L2.slackIdx];
    L2.slack += act.rate*dt;
    L2.wake += act.wake*dt;
  }
  L2.wake = clamp(L2.wake, 0, 100);
  L2.slack = Math.max(0, L2.slack);

  // 领导发现逻辑
  if(vis && L2.pState!=='work'){
    if(L2.leader.state!=='alert'){
      if(L2.bail){
        // 同事望风：把领导缠住
        L2.bail = false;
        L2.leader.state='detained'; L2.leader.st=0; L2.leader.stateDur=3.5;
        msg2(L2.leader.x-24, L2.leader.y-26, '同事缠住了领导!', '#8ad4b0');
        Au.tone(600,0.1,'sine',0.1,200);
      } else {
        L2.leader.state='alert'; L2.leader.st=0;
        var fx=SEAT2.x-L2.leader.x, fy=SEAT2.y-L2.leader.y, fd=Math.hypot(fx,fy)||1;
        L2.leader.face={x:fx/fd, y:fy/fd};
        Au.tone(660,0.1,'square',0.09);
        hintOnce('l2alert','<b>被看到了！</b>快按 空格 / S 切回工作！');
      }
    } else {
      L2.leader.st += dt;
      if(L2.leader.st>0.75){
        var wasSleep = (L2.pState==='sleep');
        L2.caught++;
        L2.wake = clamp(L2.wake + (wasSleep?28:14), 0, 100);
        L2.slack = Math.max(0, L2.slack - (wasSleep?25:45));
        L2.pState='work'; L2.slackType=null;
        L2.leader.state='scold'; L2.leader.st=0; L2.leader.stateDur=2.2;
        L2.shakeT=0.45;
        msg2(146, 110, wasSleep?'上班时间睡觉!?':'你在干什么?!', '#ff8d8d');
        Au.whistle();
        if(L2.caught>=3){ endRun2('fired'); return; }
      }
    }
  }

  if(L2.shakeT>0) L2.shakeT -= dt;
  for(var i=L2.msgs.length-1;i>=0;i--){
    var m=L2.msgs[i]; m.y-=9*dt; m.life-=dt;
    if(m.life<=0) L2.msgs.splice(i,1);
  }

  if(L2.wake<=2){ endRun2('sleep'); return; }
  if(L2.wake>=98){ endRun2('awake'); return; }
  if(L2.dayT >= L2.DAY_LEN){ startOutro2(); return; }

  Au.tickBGM();
}

function endRun2(type){
  G.state='failing';
  L2.failType=type; L2.failT=0;
  if(type==='sleep') Au.failSleep();
  else if(type==='awake') Au.failAwake();
  else { Au.whistle(); Au.tone(220,0.6,'sawtooth',0.07,-80); }
}

function clockStr2(){
  var mins = 9*60 + clamp(L2.dayT/L2.DAY_LEN,0,1)*9*60;
  var hh = Math.floor(mins/60), mm = Math.floor(mins%60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}

function updateIntro(dt){
  var I = intro;
  I.t += dt; I.pt += dt;
  if(I.phase==='sleep'){
    if(I.t>0.5){
      I.clockT -= dt;
      if(I.clockT<=0){ I.clockT=0.3; I.ring=!I.ring; Au.tone(I.ring?960:730, 0.06, 'square', 0.045); }
    }
    if(I.t>3.5){
      I.phase='situp'; I.pt=0; I.x=95; I.y=218;
      Au.tone(320,0.1,'square',0.08); Au.noise(0.12,700,0.1);
    }
  } else if(I.phase==='situp'){
    I.x=95; I.y=200;    // 坐在床沿(屁股在床上,脚垂向地面)
    if(I.pt>1.1){ I.phase='rise'; I.pt=0; I.x=95; I.y=202; Au.noise(0.08,500,0.08); }
  } else if(I.phase==='rise'){
    I.x=95; I.y=202;
    if(I.pt>0.8){ I.phase='stretch'; I.pt=0; }
  } else if(I.phase==='stretch'){
    var k = Math.min(1, I.pt/0.35);
    I.x = 95 + 26*k; I.y = 202;    // 站起并离床一步
    if(I.pt>1.1){ I.phase='bleary'; I.pt=0; }
  } else if(I.phase==='bleary'){
    I.x=138; I.y=210;
    if(I.pt>0.8){ I.phase='walk'; I.pt=0; }
  } else if(I.phase==='walk'){
    var wp = INTRO_WP[I.wp];
    var dx = wp.x-I.x, dy = wp.y-I.y, d = Math.hypot(dx,dy);
    var spd = 62*dt;
    I.moving = true;
    if(d <= spd){
      I.x=wp.x; I.y=wp.y; I.wp++;
      if(I.wp>=INTRO_WP.length){
        I.phase='door'; I.pt=0; I.moving=false; I.dir='back';
        Au.tone(430,0.14,'sine',0.08,90);
      }
    } else {
      I.x += dx/d*spd; I.y += dy/d*spd;
      I.step += spd*dt*0.34;
      I.dir = 'right';
    }
  } else if(I.phase==='door'){
    I.doorA = Math.min(1, I.doorA + dt/0.45);
    I.y -= 7*dt;                       // 走进门里
    if(I.pt>1.3){ I.phase='out'; I.pt=0; }
  } else if(I.phase==='out'){
    I.fade = Math.min(1, I.fade + dt/0.85);
    if(I.fade>=1) finishIntro();
  }
}

function drawTopChar(x, y, dir, moving, step, h){
  var wk = WALKSHEETS[CHAR_SEL.c];
  var row = (wk.ready && wk.rows[dir]) ? wk.rows[dir] : null;
  if(!row && wk.ready) row = wk.rows.right;   // 素材只有右行表：其余方向回退(左行镜像)
  h = h || 44;
  if(!row) return false;
  var sc = h/row.baseH;
  var n = row.frames.length;
  var fi = moving ? (Math.floor(step/2.2) % n) : 0;
  var fr = row.frames[fi];
  var ax = fr[4]!==undefined ? fr[4] : fr[2]/2;
  var flip = (dir==='left');
  if(flip){ ctx.save(); ctx.translate(Math.round(x)*2, 0); ctx.scale(-1, 1); }
  ctx.drawImage(wk.img, fr[0],fr[1],fr[2],fr[3],
    Math.round(x - ax*sc), Math.round(y - fr[3]*sc),
    Math.round(fr[2]*sc), Math.round(fr[3]*sc));
  if(flip) ctx.restore();
  return true;
}

  s.innerHTML = '睡神结局达成 <b>☾++</b><br>朦胧值 <b>'+sc+'</b>(含 睡神加成 +200)<br>梦境评分 <b>☾☾☾☾☾</b>';
  rank.textContent = '☾'; rank.style.color = '#c9b8ff';
  document.getElementById('btnNext').classList.remove('hidden');
  document.getElementById('btnBonus').classList.add('hidden');
  ovEnd.classList.remove('hidden');
}
function bonusAdvance(){
  if(BONUS.swap) return;
  var sc = BONUS_SCENES[BONUS.idx];
  var len = sc.lines[BONUS.line][1].length;
  if(BONUS.charT < len){ BONUS.charT = len; return; }   // 未打完先瞬间补完
  if(BONUS.line < sc.lines.length-1){ BONUS.line++; BONUS.charT=0; Au.tone(620,0.05,'sine',0.05); return; }
  if(BONUS.idx < BONUS_SCENES.length-1){ BONUS.swap = 1; Au.tone(420,0.12,'sine',0.06); return; }
  finishBonus();
}
function updateBonus(dt){
  BONUS.t += dt;
  var line = BONUS_SCENES[BONUS.idx].lines[BONUS.line];
  BONUS.charT = Math.min(BONUS.charT + dt*14, line[1].length);
  if(BONUS.swap===1){
    BONUS.fade = Math.min(1, BONUS.fade + dt/0.5);
    if(BONUS.fade>=1){ BONUS.idx++; BONUS.line=0; BONUS.charT=0; BONUS.swap=2; }
  } else if(BONUS.swap===2){
    BONUS.fade = Math.max(0, BONUS.fade - dt/0.7);
    if(BONUS.fade<=0) BONUS.swap=0;
  } else if(BONUS.fade>0){
    BONUS.fade = Math.max(0, BONUS.fade - dt/0.7);
  }
  Au.tickBGM();
}
function renderBonus(){
  var sc = BONUS_SCENES[BONUS.idx];
  var im = BONUS_IMG[BONUS.idx] && BONUS_IMG[BONUS.idx][CHAR_SEL.c];
  if(im && im.ready){
    var s = Math.max(480/im.width, 270/im.height);
    ctx.drawImage(im, (480-im.width*s)/2, (270-im.height*s)/2, im.width*s, im.height*s);
  } else R(0,0,480,270,'#1a1430');
  var g = ctx.createLinearGradient(0,150,0,270);
  g.addColorStop(0,'rgba(16,12,32,0)'); g.addColorStop(1,'rgba(16,12,32,0.72)');
  ctx.fillStyle=g; ctx.fillRect(0,0,480,270);
  // 视觉小说文本框
  var line = sc.lines[BONUS.line];
  var shown = line[1].slice(0, Math.floor(BONUS.charT));
  R(12, 202, 456, 56, 'rgba(24,18,44,0.88)');
  ctx.strokeStyle='rgba(245,238,218,0.3)'; ctx.lineWidth=1; ctx.strokeRect(12.5, 202.5, 455, 55);
  R(20, 194, 64, 14, 'rgba(242,207,138,0.92)');
  ctx.font='bold 8px monospace'; ctx.textBaseline='top';
  ctx.fillStyle='#3a3050';
  ctx.fillText(line[0]==='我' ? '内心' : line[0], 24, 196.5);
  ctx.font='9px monospace';
  ctx.fillStyle = line[0]==='我' ? '#f2c9d8' : '#fdf6e3';
  ctx.fillText(shown, 22, 216);
  if(BONUS.charT >= line[1].length && Math.floor(BONUS.t*2)%2===0){
    ctx.fillStyle='#ffe9b0'; ctx.fillText('▼', 450, 242);
  }
  if(BONUS.fade>0) R(0,0,480,270, 'rgba(8,6,18,'+BONUS.fade.toFixed(2)+')');
  ctx.font='8px monospace';
  ctx.fillStyle='rgba(253,246,227,0.4)';
  ctx.fillText('空格 继续 · Esc 结束', 14, 258);
}

/* ================================================================
   第二章末尾 · 回公寓上床睡觉（黄昏→夜）
   18:00 下班 → 走回床边 → 躺下 → 字幕"世界要求我们不断奔跑，偶尔让自己睡会"
   → 淡出进入结算。
   ================================================================ */
var O2 = null;
// 新房间：从门口(右上)沿底部空地走回床边(左)
var O2_WP = [ {x:398,y:120}, {x:300,y:232}, {x:100,y:214} ];
function startOutro2(){
  G.state = 'outro2';
  O2 = { t:0, phase:'walk', wp:0, x:398, y:96, dir:'right', moving:true, step:0,
         fade:0, bedA:0, subA:0 };
  document.getElementById('panelSlack').style.visibility='hidden';
}
function finish2End(){
  var o = O2; O2 = null;
  finish2(true);
}
function updateOutro2(dt){
  O2.t += dt;
  if(O2.phase==='walk'){
    var wp = O2_WP[O2.wp];
    var dx = wp.x-O2.x, dy = wp.y-O2.y, d = Math.hypot(dx,dy);
    var spd = 58*dt;
    if(d <= spd){
      O2.x=wp.x; O2.y=wp.y; O2.wp++;
      if(O2.wp>=O2_WP.length){ O2.phase='bed'; O2.moving=false; Au.tone(320,0.12,'sine',0.06,-40); }
    } else {
      O2.x += dx/d*spd; O2.y += dy/d*spd;
      O2.step += spd*dt*0.34;
      O2.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'front':'back');
    }
  } else if(O2.phase==='bed'){
    O2.bedA = Math.min(1, O2.bedA + dt/1.1);
    if(O2.t > 5.2){ O2.phase='sub'; }
  } else if(O2.phase==='sub'){
    O2.subA = Math.min(1, O2.subA + dt/1.3);
    if(O2.t > 11){ O2.phase='out'; }
  } else if(O2.phase==='out'){
    O2.fade = Math.min(1, O2.fade + dt/1.2);
    if(O2.fade>=1) finish2End();
  }
  Au.tickBGM();
}
function renderOutro2(){
  if(ROOMBG.ready) ctx.drawImage(ROOMBG.cv, 0, 0);
  else R(0,0,480,270,'#4a3a30');
  // 黄昏色调
  R(0,0,480,270,'rgba(90,40,80,0.16)');
  R(0,0,480,270,'rgba(255,120,50,0.08)');

  if(O2.phase==='bed' || O2.phase==='sub' || O2.phase==='out'){
    // 躺进床里(按性别显示床+人)
    var bs = bedSprByGender();
    if(bs.ready){
      ctx.save(); ctx.globalAlpha = Math.min(1, 0.15 + O2.bedA);
      ctx.drawImage(bs.cv, BED_RECT[0],BED_RECT[1],BED_RECT[2],BED_RECT[3]);
      ctx.restore();
    }
    // 夜色渐浓
    R(0,0,480,270,'rgba(20,16,44,'+(0.15+0.25*O2.bedA).toFixed(2)+')');
    if(O2.bedA>0.4 && Math.floor(O2.t*1.6)%2===0){
      ctx.font='bold 9px monospace'; ctx.textBaseline='top';
      ctx.fillStyle='rgba(210,225,255,0.8)';
      ctx.fillText('Z', 148, 100+Math.round(Math.sin(O2.t*2.2)*2));
    }
  } else {
    drawTopChar(O2.x, O2.y, O2.dir, O2.moving, O2.step);
    R(0,0,480,270,'rgba(60,30,70,0.12)');
  }

  // 结尾字幕
  if(O2.subA>0){
    R(0,104,480,44,'rgba(8,6,18,'+(0.5*O2.subA).toFixed(2)+')');
    ctx.font='bold 12px monospace'; ctx.textBaseline='top';
    var txt = '世界要求我们不断奔跑，偶尔让自己睡会。';
    var tw = ctx.measureText(txt).width;
    ctx.fillStyle='rgba(201,184,255,'+O2.subA.toFixed(2)+')';
    ctx.fillText(txt, Math.round((480-tw)/2), 118);
  }
  if(O2.fade>0) R(0,0,480,270,'rgba(8,6,18,'+O2.fade.toFixed(2)+')');
}

var last = performance.now();
function loop(now){
  var dt = Math.min((now-last)/1000, 0.05);
  last = now;
  try{
    update(dt);
    render();
    syncHUD();
  }catch(e){
    var d=document.getElementById('err');
    d.style.display='block';
    d.textContent='循环错误: '+e.message;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
